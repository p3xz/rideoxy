name: Build iOS IPA (Free / No Apple Dev Account)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Xcode ──────────────────────────────────────────────────────────
      # React Native 0.81.5 requires Xcode >= 16.1.
      # Select Xcode 16.4 which has the complete iOS 18 platform installed,
      # avoiding the Xcode 16.2 "iOS 18.2 Platform Not Installed" bug.
      - name: Select Xcode (compatible with RN 0.81.5)
        run: |
          echo "Available Xcode installations on runner:"
          ls -la /Applications/ | grep -i xcode

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            XCODE_APP=$(ls /Applications/ | grep -E '^Xcode_16\.[1-9]' | sort -V | tail -1)
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi

          echo "Selected developer directory: $(xcode-select -p)"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch

      # ── 3. Node.js 24 ─────────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # ── 4. Dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 5. Expo Prebuild ──────────────────────────────────────────────────
      - name: Expo prebuild (iOS native project generation)
        run: npx expo prebuild --platform ios --clean --no-install

      # ── 6. Bundle JavaScript & Assets with Hermes ─────────────────────────
      # Expo's export:embed compiles JS into Hermes bytecode (.hbc format named main.jsbundle)
      - name: Bundle JavaScript & Assets
        run: |
          mkdir -p ios/assets
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform ios \
            --dev false \
            --reset-cache \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/assets
          echo "=== Hermes JS Bundle Size ==="
          ls -lh ios/main.jsbundle
          file ios/main.jsbundle

      # ── 7. CocoaPods ──────────────────────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ── 8. Native Release Build ───────────────────────────────────────────
      - name: Build unsigned Release .app with Xcode
        env:
          NODE_BINARY: node
        run: |
          set -o pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/Rideoxy.xcworkspace \
            -scheme Rideoxy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            ENTRY_FILE="node_modules/expo-router/entry.js" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # ── 9. Critical Validation: inspect .app ───────────────────────────────
      - name: Validate .app bundle and contents
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Rideoxy.app"

          echo "=== 1. Checking .app directory ==="
          if [ ! -d "$APP" ]; then
            echo "❌ Error: $APP directory does not exist!"
            exit 1
          fi

          # Ensure JS bundle and assets are placed inside .app
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "Copying generated Hermes main.jsbundle into .app..."
            cp ios/main.jsbundle "$APP/main.jsbundle"
          fi

          if [ -d "ios/assets" ]; then
            echo "Copying assets into .app..."
            cp -r ios/assets/* "$APP/" 2>/dev/null || true
          fi

          echo "=== 2. Checking total .app size ==="
          APP_SIZE_KB=$(du -sk "$APP" | awk '{print $1}')
          echo "App bundle size: ${APP_SIZE_KB} KB"
          if [ "$APP_SIZE_KB" -lt 15000 ]; then
            echo "❌ Error: App bundle size (${APP_SIZE_KB} KB) is suspiciously small (< 15 MB)!"
            echo "This indicates a hollow or incomplete build shell."
            exit 1
          fi

          echo "=== 3. Checking native Mach-O executable ==="
          if [ ! -f "$APP/Rideoxy" ]; then
            echo "❌ Fatal: Main binary 'Rideoxy' not found in $APP!"
            exit 1
          fi
          file "$APP/Rideoxy"

          echo "=== 4. Checking JavaScript / Hermes application bundle ==="
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "❌ Fatal: 'main.jsbundle' not found in $APP!"
            exit 1
          fi
          BUNDLE_SIZE_KB=$(du -sk "$APP/main.jsbundle" | awk '{print $1}')
          echo "main.jsbundle size: ${BUNDLE_SIZE_KB} KB"
          if [ "$BUNDLE_SIZE_KB" -lt 1000 ]; then
            echo "❌ Error: main.jsbundle is suspiciously small (< 1 MB)!"
            exit 1
          fi
          file "$APP/main.jsbundle"

          echo "=== 5. Checking embedded Frameworks ==="
          if [ ! -d "$APP/Frameworks" ]; then
            echo "❌ Error: Frameworks directory missing from $APP!"
            exit 1
          fi
          ls -la "$APP/Frameworks"

          echo "=== 6. Full .app file listing ==="
          ls -lh "$APP"
          echo "✅ Critical validation passed: App contains genuine binary, Hermes bundle, and frameworks!"

      # ── 10. Package into .ipa ──────────────────────────────────────────────
      - name: Package .app into .ipa
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Rideoxy.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/Rideoxy.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr rideoxy.ipa Payload

          echo "=== IPA Size ==="
          du -sh rideoxy.ipa
          ls -lh rideoxy.ipa

          IPA_SIZE_KB=$(du -sk rideoxy.ipa | awk '{print $1}')
          if [ "$IPA_SIZE_KB" -lt 10000 ]; then
            echo "❌ Error: Resulting IPA size (${IPA_SIZE_KB} KB) is under 10 MB!"
            echo "Expected a complete application package (typically 30-80 MB)."
            exit 1
          fi
          echo "✅ IPA package size verified: ${IPA_SIZE_KB} KB"

      # ── 11. Upload Artifact ───────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: rideoxy-ios-ipa
          path: ${{ runner.temp }}/ipa/rideoxy.ipa
          retention-days: 7
          if-no-files-found: error
